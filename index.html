<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PZEM-016 Monitor - GitHub Pages</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
        }
        h1 { 
            text-align: center; 
            color: #2c3e50; 
            margin-bottom: 5px;
        }
        .status-bar {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .connected { color: #27ae60; }
        .disconnected { color: #c0392b; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            text-align: center; 
        }
        .card h3 { 
            margin: 0 0 10px 0; 
            color: #7f8c8d; 
            font-size: 14px; 
            text-transform: uppercase; 
        }
        .card p { 
            margin: 0; 
            font-size: 24px; 
            font-weight: bold; 
            color: #2980b9; 
        }
        .chart-container { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            height: 40vh; 
            width: 100%; 
            box-sizing: border-box; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PZEM-016 Cloud Monitor</h1>
        <div class="status-bar">
            Status Koneksi Broker: <span id="status" class="disconnected">Menghubungkan...</span>
        </div>
        
        <div class="grid">
            <div class="card"><h3>Tegangan</h3><p><span id="v">0.0</span> V</p></div>
            <div class="card"><h3>Arus</h3><p><span id="i">0.000</span> A</p></div>
            <div class="card"><h3>Daya (Beban)</h3><p><span id="p">0.0</span> W</p></div>
            <div class="card"><h3>Energi Total</h3><p><span id="e">0.000</span> kWh</p></div>
            <div class="card"><h3>Frekuensi</h3><p><span id="f">0.0</span> Hz</p></div>
            <div class="card"><h3>Power Factor</h3><p><span id="pf">0.00</span></p></div>
        </div>

        <div class="chart-container">
            <canvas id="wattChart"></canvas>
        </div>
    </div>

    <script>
        // --- Konfigurasi MQTT ---
        const broker = "broker.emqx.io";
        const port = 8084; // Port WSS (Secure WebSocket) wajib untuk HTTPS/GitHub Pages
        const topic = "/aisi555/pzem016";
        const clientID = "web_client_" + Math.random().toString(16).substr(2, 8);

        // Inisialisasi Paho MQTT Client
        const mqttClient = new Paho.MQTT.Client(broker, port, clientID);

        // Atur Callback MQTT
        mqttClient.onConnectionLost = onConnectionLost;
        mqttClient.onMessageArrived = onMessageArrived;

        // Opsi koneksi secure dengan SSL
        const connectOptions = {
            onSuccess: onConnect,
            onFailure: onFailure,
            useSSL: true, 
            timeout: 3,
            keepAliveInterval: 60
        };

        // Hubungkan ke broker
        mqttClient.connect(connectOptions);

        function onConnect() {
            console.log("Terhubung ke MQTT Broker.");
            const statusEl = document.getElementById("status");
            statusEl.innerText = "TERHUBUNG";
            statusEl.className = "connected";
            
            // Subscribe ke topik PZEM Anda
            mqttClient.subscribe(topic);
        }

        function onFailure(message) {
            console.log("Koneksi Gagal: " + message.errorMessage);
            document.getElementById("status").innerText = "GAGAL TERHUBUNG (" + message.errorMessage + ")";
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("Koneksi terputus: " + responseObject.errorMessage);
                const statusEl = document.getElementById("status");
                statusEl.innerText = "TERPUTUS. Mencoba hubungkan kembali...";
                statusEl.className = "disconnected";
                
                // Coba hubungkan ulang otomatis setelah 5 detik
                setTimeout(() => mqttClient.connect(connectOptions), 5000);
            }
        }

        function onMessageArrived(message) {
            console.log("Data Masuk: " + message.payloadString);
            
            try {
                // Parse JSON payload dari ESP8266
                const data = JSON.parse(message.payloadString);
                
                // Perbarui nilai text pada Card HTML
                document.getElementById('v').innerText = data.v.toFixed(1);
                document.getElementById('i').innerText = data.i.toFixed(3);
                document.getElementById('p').innerText = data.p.toFixed(1);
                document.getElementById('e').innerText = data.e.toFixed(3);
                document.getElementById('f').innerText = data.f.toFixed(1);
                document.getElementById('pf').innerText = data.pf.toFixed(2);

                // Perbarui data Grafik (Chart.js)
                const waktuSekarang = new Date().toLocaleTimeString();
                updateChart(waktuSekarang, data.p);

            } catch (e) {
                console.error("Format data bukan JSON standar: ", e);
            }
        }

        // --- Konfigurasi Chart.js (Grafik Real-time) ---
        const ctx = document.getElementById('wattChart').getContext('2d');
        const maxDataPoints = 20; // Jumlah titik data maksimal yang bergeser di layar

        const wattChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Beban Daya (Watt)',
                    data: [],
                    borderColor: '#2980b9',
                    backgroundColor: 'rgba(41, 128, 185, 0.1)',
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { 
                        title: { display: true, text: 'Waktu Jalur Cloud' } 
                    },
                    y: { 
                        title: { display: true, text: 'Watt (W)' },
                        beginAtZero: true 
                    }
                }
            }
        });

        function updateChart(label, val) {
            if (wattChart.data.labels.length >= maxDataPoints) {
                wattChart.data.labels.shift();      // Buang data label paling kiri
                wattChart.data.datasets[0].data.shift(); // Buang data nilai paling kiri
            }
            wattChart.data.labels.push(label);
            wattChart.data.datasets[0].data.push(val);
            wattChart.update();
        }
    </script>
</body>
</html>
